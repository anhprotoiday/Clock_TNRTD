<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1 class="timer">
            <span class="minutes">00</span> :
            <span class="seconds">00</span> .
            <span class="milliseconds">000</span>
        </h1>
        <ol class="lapContainer"></ol>
        <div class="bottomPart">
            <div class="btns">
                <button class="reset">Reset</button>
                <button class="toggle start">Start</button>
                <button class="toggle stop">Stop</button>
                <button class="lap">Lap</button>
            </div>

            <!-- <input id="myName" type="text"></input>
            <button type="button" onclick="getValue()">ok</button>  -->


</body>
<style>
    html {
        height: 100%;
        background: radial-gradient(ellipse at center, #0a2e38 0%, black 70%);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Lato', sans-serif;
    }


    .container {
        font-family: "Share Tech Mono", monospace;
        margin: auto;
        width: 500px;
        height: 500px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }

    .container,
    .lapItem {
        color: #daf6ff;
        text-shadow: 0 0 20px #0aafe6, 0 0 20px rgba(10, 175, 230, 0);
    }

    .timer {
        padding-top: 50px;
        font-size: 76px;
        font-weight: lighter;
        color: #fff;
        margin-left: 20px;
    }

    .bottomPart {
        width: 100%;
        height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
    }

    .btns {
        width: 300px;
        height: 100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .btns button {
        width: 80px;
        height: 80px;
        background-color: transparent;
        color: #fff;
        border: none;
        border-radius: 50%;
        text-transform: uppercase;
        font-weight: bold;
        cursor: pointer;
        outline: none;
        box-shadow: 0px 20px 30px 0px rgba(0, 0, 0, 0.5);

    }

    .btns .toggle {
        transition: all 0.3s ease;
        background: rgb(239, 180, 98);
        background: radial-gradient(ellipse at center, #0a2e38 20%, black 100%);
        z-index: 1;
    }

    .btns .toggle:active,
    .btns .reset:active,
    .btns .lap:active {
        transform: scale(0.9);
    }

    .btns .reset,
    .btns .lap {
        transition: all 0.3s ease;
    }

    .lapContainer {
        width: 200px;
        height: 150px;
        color: #fff;
        padding-left: 30px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .lapItem {
        width: 120px;
        height: 30px;
        font-size: 18px;
        border-bottom: 1px solid #fff;
        margin-bottom: 5px;
    }

    ::-webkit-scrollbar {
        width: 15px;

    }

    ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
        background: #0a2e38;
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #0a2e38;
    }
</style>
<script>
    //Main
    var timer = document.querySelector('.timer');
    var startBtn = document.querySelector('.start');
    var stopBtn = document.querySelector('.stop');
    var resetBtn = document.querySelector('.reset');
    var lapBtn = document.querySelector('.lap');
    var lapContainer = document.querySelector('.lapContainer')
    var additionalTime = 100; // 0.1 giây trong mili giây

    var watch = new Stopwatch(timer);

    function start() {
        toggleBtn.textContent = 'Stop';
        toggleBtn.classList.toggle("on");
        watch.start();
    }

    function stop() {
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.toggle("on")
        watch.stop();
    }

    function stopWhenOn() {
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.toggle("on")
        watch.stop();
        watch.reset();
    }

    startBtn.addEventListener('click', function () {
        watch.offset = Date.now() - additionalTime; // Thêm 0.1 giây
        watch.start();
    });

    stopBtn.addEventListener('click', function () {
        watch.stop();
    });

    resetBtn.addEventListener('click', function () {
        watch.isOn ? stopWhenOn() : watch.reset();
        // stop();
    });

    lapBtn.addEventListener('click', function () {
        watch.isOn ? watch.lapOn() : watch.lapOff();
    })

    //StopWatch
    function Stopwatch(elem) {
        var time = 0;
        var offset;
        var interval;

        function lapOn() {
            var lapTime = lapContainer.appendChild(document.createElement("li"))
            lapTime.innerHTML = elem.textContent;
            lapTime.classList = 'lapItem'
        }

        function lapOff() {
            return;
        }

        function update() {
            if (this.isOn) {
                time += delta();
            }
            elem.textContent = timeFormatter(time);
        }

        function delta() {
            var now = Date.now();
            var timePassed = now - offset;

            offset = now;

            return timePassed;
        }

        function timeFormatter(time) {
            time = new Date(time);

            var minutes = time.getMinutes().toString();
            var seconds = time.getSeconds().toString();
            var milliseconds = time.getMilliseconds().toString();

            if (minutes.length < 2) {
                minutes = '0' + minutes;
            }

            if (seconds.length < 2) {
                seconds = '0' + seconds;
            }

            while (milliseconds.length < 3) {
                milliseconds = '0' + milliseconds;
            }

            var result = minutes + ' : ' + seconds + ' . ' + milliseconds;

            return result;
        }

        this.start = function () {
            interval = setInterval(update.bind(this), 1);
            offset = Date.now() - additionalTime; // Thêm 0.1 giây
            this.isOn = true;
        };

        this.stop = function () {
            clearInterval(interval);
            interval = null;
            this.isOn = false;
        };

        this.reset = function () {
            time = 0;
            lapContainer.innerHTML = '';
            interval = null;
            this.isOn = false;
            update();
        };

        this.lapOn = function () {
            lapOn();
        }

        this.lapOff = function () {
            lapOff();
        }

        this.isOn = false;

    }
    //READ SENSOR
    window.addEventListener('load', function () {
        updataD0();
        updataD1();
    });
    function updataD0() {
        var xhttp0 = new XMLHttpRequest();
        xhttp0.onreadystatechange = function () {
            //SET ĐIỀU KIỆN ĐỂ ĐỌC GIÁ TRỊ
            if (this.readyState == 4 && this.status == 200) {
                // NẾU GIÁ TRỊ CẢM BIẾN D0 là 0 BẤM VÔ CHẠY START
                if (parseInt(xhttp0.responseText) == 0) {
                    watch.start();
                }
                updataD0();
            }
        }
        xhttp0.open('GET', 'http://192.168.1.3/d0.html', true);
        xhttp0.send();
    }
    //READ SENSOR
    function updataD1() {
        var xhttp1 = new XMLHttpRequest();
        xhttp1.onreadystatechange = function () {
            //SET ĐIỀU KIỆN ĐỂ ĐỌC GIÁ TRỊ
            if (this.readyState == 4 && this.status == 200) {
                // NẾU GIÁ TRỊ CẢM BIẾN D1 LÀ 0 THÌ IN GIÁ TRỊ THỜI GIAN RA
                if (parseInt(xhttp1.responseText) == 0) {
                    watch.lapOn(), watch.stop();
                }
                updataD1();

            }
        }
        xhttp1.open('GET', 'http://192.168.1.3/d1.html', true);
        xhttp1.send();
    }

</script>
